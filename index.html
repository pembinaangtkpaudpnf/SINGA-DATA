<style>
:root{--n:#0b2559;--n2:#1b3d86;--g:#e9a23b;--m:#5b6475;--t:#1f2937;--bd:#e3e8f2}
*{box-sizing:border-box}body{margin:0;font:14px/1.5 system-ui,Arial,sans-serif;background:#f3f5fa;color:var(--t)}
aside{position:fixed;inset:0 auto 0 0;width:250px;background:linear-gradient(180deg,var(--n),var(--n2));color:#fff;display:flex;flex-direction:column;z-index:20;transition:transform .25s}
.brand{padding:24px 22px 18px;border-bottom:1px solid rgba(255,255,255,.12)}.brand b{font-size:22px;letter-spacing:.5px}.brand b::after{content:"";display:block;width:34px;height:3px;background:var(--g);margin-top:6px}.brand small{display:block;opacity:.75;margin-top:8px}
nav{padding:14px 12px;flex:1}nav button{display:flex;align-items:center;gap:12px;width:100%;text-align:left;border:0;background:none;color:#dbe4f7;padding:12px 14px;margin-bottom:4px;border-radius:10px;font:inherit;cursor:pointer}
nav button i{font-style:normal;font-size:18px;width:24px}nav button:hover{background:rgba(255,255,255,.09)}nav button.on{background:#fff;color:var(--n);font-weight:700;box-shadow:inset 4px 0 0 var(--g)}
.foot{padding:16px 18px;border-top:1px solid rgba(255,255,255,.12);font-size:12px;color:#c9d6f2}
.tg{display:flex;gap:10px;align-items:center;cursor:pointer;margin-bottom:10px}.tg input{display:none}.tg span{flex:none;width:36px;height:20px;border-radius:20px;background:#ffffff44;position:relative;transition:.2s}
.tg span::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:.2s}.tg input:checked+span{background:var(--g)}.tg input:checked+span::after{left:18px}
.wrap{margin-left:250px;min-height:100vh}.top{display:flex;align-items:center;gap:14px;padding:22px 32px 6px}.top h2{margin:0;font-size:24px;color:var(--n)}.top p{margin:2px 0 0;color:var(--m)}
#mb{display:none;border:0;background:var(--n);color:#fff;border-radius:8px;font-size:20px;padding:6px 12px;cursor:pointer}#ov{display:none}
main{padding:16px 32px 40px}.v{display:none}.v.on{display:block}
.card{background:#fff;border:1px solid var(--bd);border-radius:14px;padding:18px;box-shadow:0 2px 8px rgba(20,40,90,.05)}
.kp{display:grid;grid-template-columns:repeat(auto-fit,minmax(190px,1fr));gap:16px;margin-bottom:16px}
.kc{border-left:5px solid var(--n)}.kc span{color:var(--m);font-size:13px}.kc b{display:block;font-size:34px;color:var(--n);line-height:1.2}
.g2{display:grid;grid-template-columns:2fr 1fr;gap:16px;margin-bottom:16px}.cw{position:relative;height:360px}.cw h4,.card h4{margin:0 0 10px;color:var(--n)}
.fb{display:flex;flex-wrap:wrap;gap:14px;align-items:flex-end;margin-bottom:16px}.fg{display:flex;flex-direction:column;gap:4px;flex:1;min-width:190px;max-width:280px}.fg label{font-size:12px;font-weight:600;color:var(--m)}
.fb input,.fb select{padding:10px 12px;border:1px solid #cfd7e6;border-radius:8px;font:inherit;background:#fff}.fb input:focus,.fb select:focus{outline:2px solid #9db8f2;border-color:#4a76d8}
.rs{padding:10px 16px;border:1px solid var(--n);color:var(--n);background:#fff;border-radius:8px;cursor:pointer;font:inherit}.rs:hover{background:var(--n);color:#fff}
.th{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px}.th span{color:var(--m)}
.tw{overflow:auto;max-height:72vh;border:1px solid var(--bd);border-radius:10px}table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:10px 12px;border-bottom:1px solid #eef1f7;text-align:left;white-space:nowrap}th{position:sticky;top:0;background:#eaf0fb;color:var(--n);z-index:1}tbody tr:nth-child(even){background:#fafbfe}tbody tr:hover{background:#eef4ff}
.wa{display:inline-flex;vertical-align:middle;margin-left:6px}.wa svg{width:18px;height:18px;fill:#25D366}.pill{background:#fff3e0;color:#b45309;border-radius:20px;padding:3px 10px;font-weight:600;font-size:12.5px}
.pg{display:flex;gap:10px;align-items:center;justify-content:flex-end;margin-top:12px;color:var(--m)}.pg button,.pg select{padding:7px 14px;border:1px solid #cfd7e6;background:#fff;border-radius:8px;cursor:pointer;font:inherit}.pg button:disabled{opacity:.4;cursor:default}
.hm th,.hm td{text-align:center}.hm td:first-child,.hm th:first-child{text-align:left}
.hero{border-radius:16px;padding:44px;color:#fff;margin-bottom:20px;background:linear-gradient(135deg,var(--n),#6a56c4 60%,#b0464a)}.hero h1{margin:0;font-size:clamp(34px,5vw,60px)}.hero p{font-size:17px;margin:8px 0 0}
.tl{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px}.tile{text-align:left;cursor:pointer;font:inherit;transition:.15s}.tile:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(20,40,90,.12)}
.tile i{font-style:normal;font-size:28px}.tile b{display:block;font-size:34px;color:var(--n)}.tile strong{display:block}.tile span{color:var(--m);font-size:13px}.note{margin-top:20px;color:var(--m)}
@media(max-width:900px){aside{transform:translateX(-100%)}aside.open{transform:none}.wrap{margin-left:0}#mb{display:block}#ov.open{display:block;position:fixed;inset:0;background:#0006;z-index:15}.g2{grid-template-columns:1fr}main,.top{padding-left:16px;padding-right:16px}.hero{padding:28px}}
body.auth aside,body.auth .wrap{display:none}#lg{display:none;min-height:100vh;align-items:center;justify-content:center;padding:20px;background:linear-gradient(135deg,#0b2559,#6a56c4 60%,#b0464a)}body.auth #lg{display:flex}
.lc{width:100%;max-width:400px;padding:30px}.lc .lb b{font-size:26px;color:var(--n);display:block}.lc .lb small{color:var(--m)}.lc h3{margin:22px 0 10px;color:var(--n)}.lc label{display:block;font-size:12px;font-weight:600;color:var(--m);margin:12px 0 4px}
.lc input{width:100%;padding:11px 12px;border:1px solid #cfd7e6;border-radius:8px;font:inherit}.pw{position:relative}.pw button{position:absolute;right:6px;top:4px;border:0;background:none;font-size:18px;cursor:pointer}
.lbtn{width:100%;margin:18px 0 12px;padding:12px;border:0;border-radius:8px;background:var(--n);color:#fff;font:inherit;font-weight:700;cursor:pointer}.lbtn:disabled{opacity:.6}.le{color:#b42318;min-height:18px;margin:0;font-size:13px}
.usr{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:12px}.usr button{border:1px solid #ffffff66;background:none;color:#fff;border-radius:8px;padding:6px 10px;cursor:pointer}
.hm td[data-k],.hm th[data-k]{cursor:pointer}.hm td[data-k]:hover,.hm th[data-k]:hover{outline:2px solid var(--n);outline-offset:-2px}.hm .sel{outline:3px solid var(--n)!important;outline-offset:-3px;font-weight:700}
.chip{display:flex;gap:10px;align-items:center;flex-wrap:wrap;background:#eef4ff;border:1px solid #bcd0f5;border-radius:10px;padding:8px 12px;margin-bottom:12px}.chip button{border:0;background:var(--n);color:#fff;border-radius:6px;padding:4px 10px;cursor:pointer}.hint{color:var(--m);margin:0 0 10px;font-size:13px}
.xl{padding:8px 14px;border:0;border-radius:8px;background:#188038;color:#fff;font:inherit;font-weight:600;cursor:pointer}.xl:hover{background:#136b2e}
.hr{display:flex;gap:12px;align-items:center;margin-bottom:12px}.hr .chip,.hr .hint{margin:0;flex:1}.hr .xl{flex:none}
.sbl{display:flex;align-items:center;justify-content:center;gap:10px;background:#fff;border-radius:12px;padding:8px 12px;margin-bottom:16px}.sbl img{height:36px;width:auto;display:block}.sbl i,.lgr i{width:1px;align-self:stretch;background:#d6dcea}
.lgr{display:flex;align-items:center;justify-content:center;gap:16px;margin-bottom:18px;padding-bottom:16px;border-bottom:1px solid var(--bd)}.lgr img{height:62px;width:auto;display:block}
@media(max-width:480px){.lgr img{height:50px}}
.note a.wl{color:#128c7e;font-weight:700;text-decoration:none;border-bottom:1px dashed #128c7e}.note a.wl:hover{color:#075e54}
.pill.ok{background:#e6f4ea;color:#137333}.pill.no{background:#f1f3f4;color:#5f6368;font-weight:500}
.lc small a.wl{color:#128c7e;font-weight:700;text-decoration:none;border-bottom:1px dashed #128c7e}.lc small a.wl:hover{color:#075e54}
</style></head><body class="auth">

function xl(name,sheets){if(typeof XLSX==='undefined'){alert('Pustaka Excel belum termuat. Periksa koneksi internet lalu muat ulang halaman.');return}
const wb=XLSX.utils.book_new();sheets.forEach(([t,a])=>{const ws=XLSX.utils.aoa_to_sheet(a);ws['!cols']=a[0].map((_,i)=>({wch:Math.min(45,Math.max(8,...a.slice(0,300).map(r=>String(r[i]==null?'':r[i]).length))+2)}));XLSX.utils.book_append_sheet(wb,ws,t)});
XLSX.writeFile(wb,'SINGA-DATA_'+name+'_'+new Date().toISOString().slice(0,10)+'.xlsx')}
const xinfo=(page,extra)=>['Info',[['Keterangan','Nilai'],['Halaman',page],['Diunduh pada',new Date().toLocaleString('id-ID')],['Diunduh oleh',D.user.nama],...(extra||[])]];
function chart(k,cv,type,data,o){CH[k]&&CH[k].destroy();CH[k]=new Chart(cv,{type,data,options:Object.assign({responsive:true,maintainAspectRatio:false},o||{})})}
function grp(R){const m={};R.forEach(r=>{const k=kec(r)||'-',j=jen(r)||'-';(m[k]=m[k]||{})[j]=(m[k][j]||0)+1});const t=o=>Object.values(o).reduce((a,b)=>a+b,0);const L=Object.keys(m).sort((a,b)=>t(m[b])-t(m[a]));return{L,ds:uniq(R.map(jen)).map(j=>({label:j,data:L.map(k=>m[k][j]||0),backgroundColor:COL[j]||'#9aa0a6'}))}}
function charts(label,h){return(R,box,id)=>{const G=grp(R),J=uniq(R.map(jen));
box.innerHTML=`<div class="kp"><div class="card kc"><span>${label}</span><b>${R.length}</b></div>${J.map(j=>`<div class="card kc" style="border-color:${COL[j]||'#9aa0a6'}"><span>Jenjang ${j}</span><b>${R.filter(r=>jen(r)===j).length}</b></div>`).join('')}</div><div class="g2"><div class="card"><h4>Sebaran per Kecamatan</h4><div class="cw"><canvas></canvas></div></div><div class="card"><h4>Komposisi Jenjang</h4><div class="cw"><canvas></canvas></div></div></div>`;
const cv=box.querySelectorAll('canvas');
chart(id+'a',cv[0],'bar',{labels:G.L,datasets:G.ds},{indexAxis:h?'y':'x',plugins:{legend:{position:'bottom'}}});
chart(id+'b',cv[1],'doughnut',{labels:J,datasets:[{data:J.map(j=>R.filter(r=>jen(r)===j).length),backgroundColor:J.map(j=>COL[j]||'#9aa0a6')}]},{plugins:{legend:{position:'bottom'}}})}}
function heat(R,box,id){const y0=new Date().getFullYear(),Y=[...Array(8)].map((_,i)=>y0+i),m={};
R.forEach(r=>{const y=yr(r);if(y>=y0&&y<y0+8){const k=kec(r)||'-';(m[k]=m[k]||{})[y]=(m[k][y]||0)+1}});
const L=Object.keys(m).sort(),mx=Math.max(1,...L.flatMap(k=>Object.values(m[k]))),tot=Y.map(y=>L.reduce((a,k)=>a+(m[k][y]||0),0)),all=tot.reduce((a,b)=>a+b,0);
const sel=(k,y)=>HS.k===k&&String(HS.y)===String(y)?' sel':'';
const cell=(v,k,y,st)=>v?`<td data-k="${esc(k)}" data-y="${y}" class="${sel(k,y)}" style="${st||''}">${v}</td>`:`<td style="${st||''}">-</td>`;
const info=HS.k||HS.y!==''?`<div class="chip">Menampilkan: <b>${HS.k?'Kecamatan '+esc(HS.k):'Semua kecamatan'} · ${HS.y!==''?'Tahun '+HS.y:'Semua tahun'}</b><button data-clr>✕ Hapus pilihan</button></div>`:'<p class="hint">💡 Klik angka pada tabel untuk menampilkan daftar Kepala Sekolah yang bersangkutan di tabel bawah.</p>';
box.innerHTML=`<div class="kp"><div class="card kc"><span>KS pensiun ${y0}–${y0+7}</span><b>${all}</b></div><div class="card kc"><span>Puncak tahun</span><b>${all?Y[tot.indexOf(Math.max(...tot))]:'-'}</b></div></div><div class="card" style="margin-bottom:16px;overflow:auto"><h4>Heat Map Pensiun per Kecamatan</h4><div class="hr">${info}<button class="xl" data-xlh>⬇ Unduh Excel</button></div><table class="hm"><tr><th>Kecamatan</th>`+Y.map(y=>'<th>'+y+'</th>').join('')+'<th>Total</th></tr>'+L.map(k=>'<tr><td>'+esc(k)+'</td>'+Y.map(y=>{const v=m[k][y]||0;return cell(v,k,y,'background:rgba(232,90,40,'+(v?(.1+.8*v/mx).toFixed(2):0)+')')}).join('')+cell(Y.reduce((a,y)=>a+(m[k][y]||0),0),k,'','font-weight:700')+'</tr>').join('')+'<tr><th>Grand total</th>'+tot.map((v,i)=>v?`<th data-k="" data-y="${Y[i]}" class="${sel('',Y[i])}">${v}</th>`:'<th>-</th>').join('')+'<th>'+all+'</th></tr></table></div>';
box.onclick=e=>{const c=e.target.closest('[data-k],[data-clr],[data-xlh]');if(!c)return;
if(c.hasAttribute('data-xlh')){xl('Heatmap_Pensiun',[['Heatmap',[['Kecamatan',...Y,'Total'],...L.map(k=>[k,...Y.map(y=>m[k][y]||0),Y.reduce((a,y)=>a+(m[k][y]||0),0)]),['Grand total',...tot,all]]],xinfo(T.pen[0])]);return}
if(c.hasAttribute('data-clr'))HS={k:'',y:''};else{const k=c.dataset.k,y=c.dataset.y===''?'':+c.dataset.y;HS=(HS.k===k&&HS.y===y)?{k:'',y:''}:{k,y}}
const el=$('#'+id);el._draw();if(HS.k||HS.y!=='')el.querySelector('.fb').scrollIntoView({behavior:'smooth',block:'start'})}}
function mount(id,rows,cols,fl,extra,pre){const el=$('#'+id);let p=0,n=100,f=fl.map(x=>x.d||''),ctr=[];
el.innerHTML='<div class="ex"></div><div class="card fb"></div><div class="card"><div class="th"><h4 style="margin:0">Daftar Data</h4><div style="display:flex;gap:14px;align-items:center"><span></span><button class="xl">⬇ Unduh Excel</button></div></div><div class="tw"></div><div class="pg"></div></div>';
const bar=el.querySelector('.fb');
fl.forEach((x,i)=>{let e;if(x.t==='s'){e=document.createElement('select');e.innerHTML='<option value="">Semua</option>'+uniq(rows.map(x.f)).map(v=>'<option>'+esc(v)+'</option>').join('');e.value=x.d||''}else{e=document.createElement('input');e.placeholder='Ketik untuk mencari…'}
e.oninput=e.onchange=()=>{f[i]=e.value;p=0;draw()};ctr.push(e);const w=document.createElement('div');w.className='fg';w.innerHTML='<label>'+x.l+'</label>';w.appendChild(e);bar.appendChild(w)});
const rs=document.createElement('button');rs.className='rs';rs.textContent='Reset filter';rs.onclick=()=>{HS={k:'',y:''};fl.forEach((x,i)=>{f[i]=x.d||'';ctr[i].value=x.d||''});p=0;draw()};bar.appendChild(rs);
let cT=[],cC=[];
el.querySelector('.xl').onclick=()=>{if(!cT.length){alert('Tidak ada data untuk diunduh.');return}
xl(XN[id],[['Data',[['No',...cC.map(c=>c[0])],...cT.map((r,i)=>[i+1,...cC.map(c=>{const v=g(r,...c[1]);return(c[2]||'').includes('d')?dt(v):((c[2]||'').includes('c')&&!v?'Belum':v)})])]],xinfo(T[id][0],[['Jumlah data',cT.length],...fl.map((x,i)=>['Filter: '+x.l,f[i]||'Semua'])])])};
const draw=el._draw=()=>{const R=rows.filter(r=>fl.every((x,i)=>!f[i]||(x.t==='s'?x.f(r)===f[i]:x.f(r).toLowerCase().includes(f[i].toLowerCase()))));
extra&&extra(R,el.querySelector('.ex'),id);const T=pre?R.filter(pre):R;
const C=cols.filter(c=>SHOW||!(c[2]||'').includes('s')),pages=Math.max(1,Math.ceil(T.length/n));p=Math.min(p,pages-1);cT=T;cC=C;
el.querySelector('.th span').textContent=T.length+' data';
el.querySelector('.tw').innerHTML='<table><thead><tr><th>No</th>'+C.map(c=>'<th>'+c[0]+'</th>').join('')+'</tr></thead><tbody>'+(T.length?T.slice(p*n,p*n+n).map((r,i)=>'<tr><td>'+(p*n+i+1)+'</td>'+C.map(c=>{let v=g(r,...c[1]);const q=c[2]||'';if(q.includes('d'))v=dt(v);return'<td>'+(q.includes('c')?(v?'<span class="pill ok">✓ '+esc(v)+'</span>':'<span class="pill no">Belum</span>'):q.includes('w')&&v?'<span class="pill">⚠️ '+esc(v)+'</span>':c[1][0]==='nomor_hp'&&wa(v)?esc(v)+' <a class="wa" href="https://wa.me/'+wa(v)+'" target="_blank" rel="noopener" title="Chat WhatsApp">'+WA+'</a>':esc(v))+'</td>'}).join('')+'</tr>').join(''):'<tr><td colspan="'+(C.length+1)+'" style="text-align:center;padding:30px;color:#5b6475">Tidak ada data yang cocok dengan filter.</td></tr>')+'</tbody></table>';
const pg=el.querySelector('.pg');pg.innerHTML=`<span>Baris per halaman</span><select>${[25,50,100,200].map(v=>`<option${v==n?' selected':''}>${v}</option>`).join('')}</select><button ${p?'':'disabled'}>‹ Sebelumnya</button><span>${T.length?p*n+1:0}–${Math.min(T.length,p*n+n)} dari ${T.length}</span><button ${p<pages-1?'':'disabled'}>Berikutnya ›</button>`;
const b=pg.querySelectorAll('button');pg.querySelector('select').onchange=e=>{n=+e.target.value;p=0;draw()};b[0].onclick=()=>{p--;draw()};b[1].onclick=()=>{p++;draw()}};draw()}
const V={
home(){const A=D.data,m0=M0(),tl=[['ks','👤',A.ksAktif.length,'KS Aktif','Kepala Sekolah negeri yang sedang menjabat'],['keb','🏫',A.kebutuhan.length,'Kebutuhan KS','Sekolah yang dipimpin PLT'],['pen','⏳',A.ksAktif.filter(r=>iso(PDT(r))>=m0).length,'Proyeksi KS Pensiun','Kepala Sekolah dengan jadwal pensiun'],['bcks','🎓',A.bcks.length,'BCKS','Guru yang memenuhi syarat']];

ks(){mount('ks',D.data.ksAktif,COLS.ks,[{l:'Nama sekolah',f:r=>g(r,'nama_sekolah')},{l:'Nama lengkap',f:r=>g(r,'nama_lengkap')},{l:'Kecamatan',t:'s',f:kec},{l:'Jenjang',t:'s',f:jen},{l:'Sertifikat KS',t:'s',f:r=>g(r,'kepemilikan_sertifbcks','kepemilikan_sertifikat','kepemilikan_sertifikat_ks','kepemilikan_sertif')||'Belum'},{l:'Status masa penugasan',t:'s',f:r=>g(r,'statusmasapenugasan')}],charts('Jumlah KS Negeri Aktif'))},

function show(v){cur=v;document.querySelectorAll('.v').forEach(e=>e.classList.toggle('on',e.id===v));document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
